name: stereo_vision_app
description: Aplikacja mobilna i webowa do pomiaru obiektów na europalecie

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.2.0

  # WebSocket (działa na mobile i web bez zmian)
  web_socket_channel: ^3.0.1

  # Aparat / picker pliku (mobile: kamera, web: file picker)
  image_picker: ^1.1.2

  # Programmatic camera access (auto-capture without user pressing shutter)
  camera: ^0.11.0

  # Zarządzanie stanem
  provider: ^6.1.2

  # Trwałe przechowywanie ustawień (URL serwera, ID urządzenia, MAC)
  shared_preferences: ^2.3.0

  # Device name for human-readable default device ID
  device_info_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

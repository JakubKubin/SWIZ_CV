services:
  backend:
    build: .
    image: stereo-vision-backend
    container_name: stereo-vision-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - session_data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  session_data:
